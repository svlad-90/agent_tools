name: Python checks

on:
  push:
  pull_request:

jobs:
  python-checks:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 mypy pytest pyyaml jsonschema

      - name: Run flake8
        run: python -m flake8 .

      - name: Run mypy
        run: >
          python -m mypy
          --explicit-package-bases
          code_map
          commit_msg
          diff_report
          paf_workspace
          task_check
          xen_harness
          yaml_map
