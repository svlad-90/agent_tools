$schema: https://json-schema.org/draft/2020-12/schema
type: object
required:
  - case
properties:
  case:
    type: object
    required:
      - name
    properties:
      name:
        type: string
        minLength: 1
      domain:
        type: string
      workspace:
        type: string
    additionalProperties: false
  uses:
    type: array
    items:
      type: object
      required:
        - domain
      properties:
        domain:
          type: string
      additionalProperties: false
  docker:
    type: object
  environments:
    type: object
  yocto:
    type: object
    properties:
      directory:
        type: string
      build_dir:
        type: string
      init_script:
        type: string
      container:
        type: string
      bitbake_args:
        type: string
      graph_output_dir:
        type: string
      graph_label:
        type: string
      graph_files:
        type: string
    additionalProperties: false
additionalProperties: false
