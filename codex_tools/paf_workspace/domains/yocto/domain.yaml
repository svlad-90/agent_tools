name: yocto
schema: schema.yaml
projection:
  prefix: YAML_CONF_
requires:
  env:
    WORKSPACE_ROOT: /workspace
    PAF_ROOT: /workspace/codex_tools/.cache/paf
    PYTHONPATH: /workspace/codex_tools/.cache/paf:/workspace/codex_tools:/workspace
  mounts:
    - source: ${WORKSPACE_ROOT}
      target: /workspace
      mode: rw
  images:
    yocto-xen:
      image: codex/yocto-xen:kirkstone-22.04
      dockerfile: codex_tools/paf_workspace/domains/environments/assets/yocto-xen/Dockerfile
      context: codex_tools/paf_workspace/domains/environments/assets/yocto-xen
      network: host
  containers:
    yocto-xen-workspace:
      image: yocto-xen
      workdir: /workspace
