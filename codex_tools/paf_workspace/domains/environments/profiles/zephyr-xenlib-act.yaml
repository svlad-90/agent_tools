case:
  name: zephyr-xenlib-act-environment
  domain: environments
  workspace: .

environments:
  zephyr_xenlib_act:
    image: zephyr-xenlib-act
    container: zephyr-xenlib-act-workspace
    repo_root: ${WORKSPACE_ROOT}/zephyr-xenlib-builders/dev/zephyr-xenlib
    project: zephyr-dom0-xt
    targets:
      - rcar_spider_ca55
      - rcar_salvator_xs_m3
      - rcar_h3ulcb_ca57
      - qemu_cortex_a53
    build_network: host
