$schema: https://json-schema.org/draft/2020-12/schema
type: object
required:
  - case
properties:
  case:
    type: object
    required:
      - name
    properties:
      name:
        type: string
        minLength: 1
      domain:
        type: string
      workspace:
        type: string
    additionalProperties: true
  uses:
    type: array
    items:
      type: object
      required:
        - domain
      properties:
        domain:
          type: string
      additionalProperties: true
  xen_zephyr:
    type: object
    properties:
      product:
        type: string
      xen:
        type: string
      dom0:
        enum:
          - linux
          - zephyr
      guests:
        type: array
        items:
          type: object
          required:
            - name
            - kind
          properties:
            name:
              type: string
            kind:
              enum:
                - zephyr
                - linux
            board:
              type: string
            app:
              type: string
            artifact:
              type: string
          additionalProperties: true
    additionalProperties: true
  validation:
    type: object
    properties:
      timeout_sec:
        type: integer
        minimum: 1
      expected:
        type: array
        items:
          type: string
      forbidden:
        type: array
        items:
          type: string
    additionalProperties: true
  docker:
    type: object
    properties:
      images:
        type: object
        additionalProperties:
          type: object
          required:
            - image
          properties:
            image:
              type: string
            dockerfile:
              type: string
            context:
              type: string
            target:
              type: string
            network:
              type: string
            build_args:
              type: object
              additionalProperties:
                type:
                  - string
                  - number
                  - boolean
          additionalProperties: false
      containers:
        type: object
        additionalProperties:
          type: object
          required:
            - image
          properties:
            image:
              type: string
            name:
              type: string
            workdir:
              type: string
            user:
              type: string
            privileged:
              type: boolean
            env:
              type: object
              additionalProperties:
                type:
                  - string
                  - number
                  - boolean
            mounts:
              type: array
              items:
                type: object
                required:
                  - source
                  - target
                properties:
                  source:
                    type: string
                  target:
                    type: string
                  mode:
                    enum:
                      - ro
                      - rw
                additionalProperties: false
            ports:
              type: array
              items:
                oneOf:
                  - type: string
                  - type: object
                    required:
                      - host
                      - container
                    properties:
                      host:
                        type:
                          - string
                          - number
                      container:
                        type:
                          - string
                          - number
                      protocol:
                        enum:
                          - tcp
                          - udp
                    additionalProperties: false
            devices:
              type: array
              items:
                type: string
            extra_args:
              type: array
              items:
                type: string
          additionalProperties: false
    additionalProperties: false
additionalProperties: true
