name: commit-msg

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/commit-msg.yml"
      - "agent_tools/tools/commit_msg/**"
  pull_request:
    paths:
      - ".github/workflows/commit-msg.yml"
      - "agent_tools/tools/commit_msg/**"
  workflow_dispatch:

jobs:
  commit-msg-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run commit message tool tests
        run: PYTHONPATH=. python -m pytest -q agent_tools/tools/commit_msg/tests
