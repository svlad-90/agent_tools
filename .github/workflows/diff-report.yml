name: diff-report

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diff-report.yml"
      - "agent_tools/tools/diff_report/**"
      - "agent_tools/tools/code_map/**"
  pull_request:
    paths:
      - ".github/workflows/diff-report.yml"
      - "agent_tools/tools/diff_report/**"
      - "agent_tools/tools/code_map/**"
  workflow_dispatch:

jobs:
  diff-report-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run diff report regression tests
        run: bash agent_tools/tools/diff_report/tests/run-ci.sh
