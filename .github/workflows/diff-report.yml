name: diff-report

on:
  push:
    paths:
      - ".github/workflows/diff-report.yml"
      - "codex_tools/diff_report/**"
      - "codex_tools/code_map/**"
      - "codex-tools-diff-report-enhancements/**"
  pull_request:
    paths:
      - ".github/workflows/diff-report.yml"
      - "codex_tools/diff_report/**"
      - "codex_tools/code_map/**"
      - "codex-tools-diff-report-enhancements/**"
  workflow_dispatch:

jobs:
  diff-report-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run diff report regression tests
        run: bash codex-tools-diff-report-enhancements/scripts/run-ci.sh
