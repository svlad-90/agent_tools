name: agent-tools-tests

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/agent-tools-tests.yml"
      - "agent_tools/tools/**"
      - "agent_tools/validation/**"
      - "agent_tools/lib/**"
  pull_request:
    paths:
      - ".github/workflows/agent-tools-tests.yml"
      - "agent_tools/tools/**"
      - "agent_tools/validation/**"
      - "agent_tools/lib/**"
  workflow_dispatch:

jobs:
  tests:
    name: headless tests
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: agent_tools/tools/requirements/*.txt

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: python -m pip install -r agent_tools/tools/requirements/dev.txt

      - name: Run headless Agent Tools tests
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest -q
          agent_tools/tools
          agent_tools/validation
          agent_tools/lib
