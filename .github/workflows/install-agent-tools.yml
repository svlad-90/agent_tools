name: install-agent-tools

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/install-agent-tools.yml"
      - "install-agent-tools.py"
      - "agent-workspace.sh"
      - "agent-workspace-web.sh"
      - "agent-workspace.command"
      - "agent-workspace-web.command"
      - "agent-workspace.cmd"
      - "agent-workspace-web.cmd"
      - "agent_tools/tools/requirements/**"
      - "agent_tools/agent_workspace/**"
      - "agent_tools/tools/task_context/**"
      - "agent_tools/tools/rules_sync/**"
      - "agent_tools/rules/**"
      - "agent_tools/skills/**"
  pull_request:
    paths:
      - ".github/workflows/install-agent-tools.yml"
      - "install-agent-tools.py"
      - "agent-workspace.sh"
      - "agent-workspace-web.sh"
      - "agent-workspace.command"
      - "agent-workspace-web.command"
      - "agent-workspace.cmd"
      - "agent-workspace-web.cmd"
      - "agent_tools/tools/requirements/**"
      - "agent_tools/agent_workspace/**"
      - "agent_tools/tools/task_context/**"
      - "agent_tools/tools/rules_sync/**"
      - "agent_tools/rules/**"
      - "agent_tools/skills/**"
  workflow_dispatch:

jobs:
  runtime-install:
    name: runtime install (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu-24.04
            image: ubuntu:24.04
            bootstrap: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates python3 python3-venv
          - distro: debian-12
            image: debian:12
            bootstrap: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates python3 python3-venv
          - distro: fedora-latest
            image: fedora:latest
            bootstrap: dnf install -y ca-certificates python3 python3-pip
          - distro: archlinux-latest
            image: archlinux:latest
            bootstrap: pacman -Sy --noconfirm ca-certificates python

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install runtime/dev dependencies in fresh target image
        env:
          TARGET_IMAGE: ${{ matrix.image }}
          TARGET_BOOTSTRAP: ${{ matrix.bootstrap }}
        run: |
          docker run --rm \
            -e TARGET_BOOTSTRAP="$TARGET_BOOTSTRAP" \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$TARGET_IMAGE" \
            sh -lc '
              set -eux
              eval "$TARGET_BOOTSTRAP"
              ./install-agent-tools.py --non-interactive --dev --skip-system-deps --no-desktop
              test -x agent-workspace.sh
              HOME=/tmp/agent-tools-desktop-smoke agent_tools/.venv/bin/python3 -m agent_tools.agent_workspace.components.desktop_integration.src.install_desktop
              test -f /tmp/agent-tools-desktop-smoke/.local/share/icons/hicolor/scalable/apps/agent-workspace.svg
              test -f /tmp/agent-tools-desktop-smoke/.local/share/applications/agent-workspace.desktop
              agent_tools/.venv/bin/python3 -c "import yaml, tiktoken; import agent_tools.tools.task_context as tc; assert tc.token_count(\"Agent Workspace\") > 0"
              agent_tools/.venv/bin/python3 -m agent_tools.tools.rules_sync sync --check
              agent_tools/.venv/bin/python3 -m pytest -q agent_tools/tools/task_context/tests/test_task_context.py
            '

  portable-install:
    name: portable install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install workspace without GTK system packages
        run: python install-agent-tools.py --non-interactive --dev --skip-system-deps --no-desktop

      - name: Smoke web/service imports on macOS
        if: runner.os == 'macOS'
        run: agent_tools/.venv/bin/python3 -c "import agent_tools.agent_workspace.components.workspace_service.api; import agent_tools.agent_workspace.components.web_frontend.api"

      - name: Smoke web/service imports on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: agent_tools/.venv/Scripts/python.exe -c "import agent_tools.agent_workspace.components.workspace_service.api; import agent_tools.agent_workspace.components.web_frontend.api"

      - name: Run portable headless tests on macOS
        if: runner.os == 'macOS'
        run: agent_tools/.venv/bin/python3 -m pytest -q agent_tools/agent_workspace/components/web_frontend/tests/test_web_service_boundary.py agent_tools/tools/task_context/tests/test_task_context.py

      - name: Run portable headless tests on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: agent_tools/.venv/Scripts/python.exe -m pytest -q agent_tools/agent_workspace/components/web_frontend/tests/test_web_service_boundary.py agent_tools/tools/task_context/tests/test_task_context.py

      - name: Check macOS launchers
        if: runner.os == 'macOS'
        run: |
          grep -q -- "--ui web" agent-workspace.command
          grep -q -- "--ui web" agent-workspace-web.command
          test -x agent-workspace.command
          test -x agent-workspace-web.command

      - name: Check Windows launchers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Select-String -Path agent-workspace.cmd -Pattern "--ui web" -Quiet)) { throw "agent-workspace.cmd does not force web UI" }
          if (-not (Select-String -Path agent-workspace-web.cmd -Pattern "--ui web" -Quiet)) { throw "agent-workspace-web.cmd does not force web UI" }

  gui-system-packages:
    name: gui packages (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu-24.04
            image: ubuntu:24.04
            bootstrap: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates python3 python3-venv
            python: python3
          - distro: debian-12
            image: debian:12
            bootstrap: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates python3 python3-venv
            python: python3
          - distro: fedora-latest
            image: fedora:latest
            bootstrap: dnf install -y ca-certificates python3 python3-pip
            python: python3
          - distro: archlinux-latest
            image: archlinux:latest
            bootstrap: pacman -Sy --noconfirm ca-certificates python
            python: python3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GTK/VTE dependencies through target package manager
        env:
          TARGET_IMAGE: ${{ matrix.image }}
          TARGET_BOOTSTRAP: ${{ matrix.bootstrap }}
          TARGET_PYTHON: ${{ matrix.python }}
        run: |
          docker run --rm \
            -e TARGET_BOOTSTRAP="$TARGET_BOOTSTRAP" \
            -e TARGET_PYTHON="$TARGET_PYTHON" \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$TARGET_IMAGE" \
            sh -lc '
              set -eux
              eval "$TARGET_BOOTSTRAP"
              "$TARGET_PYTHON" install-agent-tools.py --non-interactive --gui --no-desktop --no-skills
              agent_tools/.venv/bin/python3 -c "import gi; gi.require_version(\"Gtk\", \"3.0\"); gi.require_version(\"Vte\", \"2.91\")"
            '

  installer-dry-run:
    name: installer dry-run (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ubuntu-apt
            package_manager: apt-get
            expected_prefix: "Would run: sudo apt-get install -y"
            expected_tokens: "git graphviz plantuml python3 python3-pip python3-venv docker.io python3-gi gir1.2-gtk-3.0 gir1.2-vte-2.91 desktop-file-utils"
          - target: fedora-dnf
            package_manager: dnf
            expected_prefix: "Would run: sudo dnf install -y"
            expected_tokens: "git graphviz plantuml python3 python3-pip docker python3-gobject gtk3 vte291 desktop-file-utils"
          - target: arch-pacman
            package_manager: pacman
            expected_prefix: "Would run: sudo pacman -Sy --noconfirm --needed"
            expected_tokens: "git graphviz jdk-openjdk plantuml python python-pip docker python-gobject gtk3 vte3 desktop-file-utils"
          - target: macos-brew
            package_manager: brew
            expected_prefix: "Would run: brew install"
            expected_tokens: "git graphviz plantuml python docker pygobject3 gtk+3"
          - target: opensuse-zypper
            package_manager: zypper
            expected_prefix: "Would run: sudo zypper --non-interactive install"
            expected_tokens: "git graphviz plantuml python3 python3-pip python3-venv docker gtk3 typelib-1_0-Gtk-3_0 typelib-1_0-Vte-2_91 desktop-file-utils"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Dry-run full installer profile
        env:
          PACKAGE_MANAGER: ${{ matrix.package_manager }}
          EXPECTED_PREFIX: ${{ matrix.expected_prefix }}
          EXPECTED_TOKENS: ${{ matrix.expected_tokens }}
        run: |
          set -euo pipefail
          output="$(python3 install-agent-tools.py \
            --non-interactive \
            --dry-run \
            --package-manager "$PACKAGE_MANAGER" \
            --ui gtk \
            --system-tools \
            --docker \
            --dev \
            --no-desktop \
            --no-skills \
            --no-validate)"
          printf '%s\n' "$output"
          grep -Fq "$EXPECTED_PREFIX" <<<"$output"
          for token in $EXPECTED_TOKENS; do
            grep -Fq "$token" <<<"$output"
          done
          grep -Fq "Would run: /home/runner/work/" <<<"$output"
          grep -Fq " -m pip install -r " <<<"$output"

      - name: Dry-run portable profile without system dependencies
        run: |
          set -euo pipefail
          output="$(python3 install-agent-tools.py \
            --non-interactive \
            --dry-run \
            --skip-system-deps \
            --ui web \
            --no-desktop \
            --no-skills \
            --no-validate)"
          printf '%s\n' "$output"
          if grep -Fq "apt-get install" <<<"$output"; then
            echo "portable dry-run unexpectedly attempted system package installation" >&2
            exit 1
          fi
