name: paf-workspace

on:
  push:
    paths:
      - ".github/workflows/paf-workspace.yml"
      - "codex_tools/paf_workspace/**"
  pull_request:
    paths:
      - ".github/workflows/paf-workspace.yml"
      - "codex_tools/paf_workspace/**"
  workflow_dispatch:

jobs:
  paf-workspace-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml jsonschema

      - name: Run PAF workspace tests
        run: PYTHONPATH=codex_tools python -m pytest -q codex_tools/paf_workspace/tests
