$schema: https://json-schema.org/draft/2020-12/schema
type: object
required:
  - case
properties:
  case:
    type: object
    required:
      - name
    properties:
      name:
        type: string
        minLength: 1
      domain:
        type: string
      workspace:
        type: string
    additionalProperties: false
  uses:
    type: array
    items:
      type: object
      required:
        - domain
      properties:
        domain:
          type: string
      additionalProperties: false
  environments:
    type: object
  juce_repo_validation:
    type: object
    properties:
      repo:
        type: string
      build_dir:
        type: string
      task_dir:
        type: string
      timeout_sec:
        type: integer
        minimum: 1
      cmake_args:
        type: array
        items:
          type: string
      build_args:
        type: array
        items:
          type: string
      ctest_args:
        type: array
        items:
          type: string
    additionalProperties: true
additionalProperties: true
