case:
  name: agent-tools-repo-validation
  domain: agent-tools-repo-validation
  workspace: .
uses:
  - domain: environments
environments:
  agent_workspace_tests:
    image: agent-workspace-tests
    container: agent-workspace-tests-workspace
    build_network: host
agent_tools_repo_validation:
  repo: .
  scope: all
  pytest_targets:
    - agent_tools/tools
    - agent_tools/paf_workspace
    - agent_tools/agent_workspace/components
    - agent_tools/validation
    - agent_tools/lib
  timeout_sec: 900
  require_real_gtk: true

