case:
  name: mc-slayerworld-validation
  domain: minecraft-repo-validation
  workspace: .
uses:
  - domain: environments
environments:
  minecraft_paper:
    image: minecraft-paper
    container: minecraft-paper-workspace
    build_network: host
minecraft_repo_validation:
  repo: tasks/minecraft_development/dev/mc.slayerworld
  plugin_dir: tasks/minecraft_development/dev/mc.slayerworld/plugins/frontline-factions
  task_dir: tasks/minecraft_development
  timeout_sec: 900
  require_sqlite_bundle: true
