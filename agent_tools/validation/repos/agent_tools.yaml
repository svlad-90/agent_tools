version: 1
repo:
  id: agent_tools
  names:
    - agent_tools
  github_repos:
    - github.com/svlad-90/agent_tools
  allow_forks: true
  characteristic_files:
    - agent_tools
    - install-agent-tools.py
checks:
  - id: python-parse-check-changed
    description: Parse-check changed Python sources with code_map.
    level: repo
    backend: builtin
    cost: medium
    required: true
    suggested_command:
      - python3
      - -m
      - agent_tools.tools.code_map
      - parse-check
      - path/to/module.py
  - id: rules-sync-check
    description: Verify generated Claude rule mirrors are synchronized with workspace rules.
    level: repo
    backend: command
    cost: cheap
    required: true
    command:
      - python3
      - -m
      - agent_tools.tools.rules_sync
      - --check
    suggested_command:
      - python3
      - -m
      - agent_tools.tools.rules_sync
      - --check
